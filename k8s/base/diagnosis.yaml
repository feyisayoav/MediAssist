apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnosis
  namespace: mediassist
  labels: {app: diagnosis, part-of: mediassist}
spec:
  replicas: 1
  selector:
    matchLabels: {app: diagnosis}
  template:
    metadata:
      labels: {app: diagnosis, part-of: mediassist}
    spec:
      containers:
        - name: diagnosis
          image: mediassist-diagnosis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests: {memory: 512Mi, cpu: 250m}
            limits: {memory: 2560Mi}
          startupProbe:
            tcpSocket: {port: 8000}
            periodSeconds: 5
            failureThreshold: 60      # up to 5 min to load models
          readinessProbe:
            tcpSocket: {port: 8000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8000}
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: diagnosis
  namespace: mediassist
spec:
  selector: {app: diagnosis}
  ports:
    - port: 8000
      targetPort: 8000
