worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;

  server {
    listen 3000;
    root /app/frontend;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
