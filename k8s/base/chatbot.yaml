apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatbot-hf-cache
  namespace: mediassist
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: mediassist
  labels: {app: chatbot, part-of: mediassist}
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO volume: old pod must release it first
  selector:
    matchLabels: {app: chatbot}
  template:
    metadata:
      labels: {app: chatbot, part-of: mediassist}
    spec:
      securityContext:
        fsGroup: 1000         # image user (uid 1000) can write the PVC
      containers:
        - name: chatbot
          image: mediassist-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef: {name: mediassist-config}
          volumeMounts:
            - {name: hf-cache, mountPath: /data/hf}
          resources:
            requests: {memory: 1536Mi, cpu: 500m}
            limits: {memory: 4Gi}
          startupProbe:       # first boot downloads ~1 GB of models (cached on the PVC afterwards)
            tcpSocket: {port: 8003}
            periodSeconds: 10
            failureThreshold: 90      # 15 min
          readinessProbe:
            tcpSocket: {port: 8003}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8003}
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: hf-cache
          persistentVolumeClaim: {claimName: chatbot-hf-cache}
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: mediassist
spec:
  selector: {app: chatbot}
  ports:
    - port: 8003
      targetPort: 8003
