<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Chatbot — MediAssist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23194391'/%3E%3Cpath d='M16 24s-7-4.4-7-9.6A4 4 0 0 1 16 12a4 4 0 0 1 7 2.4C23 19.6 16 24 16 24z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
  <script>try{var t=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="chatbot" data-title="Medical Chatbot" data-subtitle="Educational answers grounded in MedQuAD — not medical advice">
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="inset">
      <header class="topbar" id="topbar"></header>
      <main class="page">
        <div class="chat-shell">
          <div id="chat-log" class="chat-log">
            <div id="chat-empty" class="chat-empty">
              <div class="orb" aria-hidden="true"></div>
              <h2>How can I help you today?</h2>
              <p>Ask a health question or start from a topic below. Answers are retrieved from the MedQuAD reference set, and weak matches are flagged.</p>

              <div class="category-grid" id="category-grid"></div>
              <div id="suggestion-panel" class="card suggestion-panel hidden"></div>
            </div>
          </div>

          <form id="chat-form" class="composer" autocomplete="off">
            <div class="composer-main">
              <input type="text" id="question-input" placeholder="Ask a medical question…" autocomplete="off" required />
              <button type="submit" id="ask-button" class="send-btn" aria-label="Send question" disabled data-icon="arrowUp" data-size="18"></button>
            </div>
            <div class="composer-bar">
              <label class="context-pill" for="context-disease">
                <span data-icon="stethoscope" data-size="15"></span>
                <input type="text" id="context-disease" placeholder="Context condition (optional)" autocomplete="off" />
              </label>
            </div>
          </form>
          <p class="chat-footnote">Educational information only — not a diagnosis or medical advice.</p>
        </div>
      </main>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <script src="js/config.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
