; Included by /etc/supervisor/supervisord.conf (it globs /etc/supervisor/conf.d/*.conf).
; Children inherit the container environment (CHATBOT_ENABLE_*, *_SERVICE_URL, ...).

[program:diagnosis]
directory=/app/services/disease-diagnosis
command=/opt/venvs/diagnosis/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:imaging]
directory=/app/services/medical-imaging
command=/opt/venvs/imaging/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:drug]
directory=/app/services/drug-recommendation
command=/opt/venvs/drug/bin/uvicorn app.main:app --host 127.0.0.1 --port 8002
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chatbot]
directory=/app/services/medical-chatbot
command=/opt/venvs/chatbot/bin/uvicorn app.main:app --host 127.0.0.1 --port 8003
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
directory=/app/gateway
command=/app/gateway/gateway
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
command=nginx -g "daemon off;"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
