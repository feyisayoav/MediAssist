apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mediassist
  labels: {app: frontend, part-of: mediassist}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, part-of: mediassist}
    spec:
      containers:
        - name: frontend
          image: mediassist-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - {name: GATEWAY_URL, value: ""}   # same origin; the Ingress sends /api to the gateway
          resources:
            requests: {memory: 16Mi, cpu: 10m}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
          livenessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mediassist
spec:
  selector: {app: frontend}
  ports:
    - port: 80
      targetPort: 80
