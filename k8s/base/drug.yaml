apiVersion: apps/v1
kind: Deployment
metadata:
  name: drug
  namespace: mediassist
  labels: {app: drug, part-of: mediassist}
spec:
  replicas: 1
  selector:
    matchLabels: {app: drug}
  template:
    metadata:
      labels: {app: drug, part-of: mediassist}
    spec:
      containers:
        - name: drug
          image: mediassist-drug:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          resources:
            requests: {memory: 128Mi, cpu: 100m}
            limits: {memory: 512Mi}
          startupProbe:
            tcpSocket: {port: 8002}
            periodSeconds: 5
            failureThreshold: 60      # up to 5 min to load models
          readinessProbe:
            tcpSocket: {port: 8002}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8002}
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: drug
  namespace: mediassist
spec:
  selector: {app: drug}
  ports:
    - port: 8002
      targetPort: 8002
