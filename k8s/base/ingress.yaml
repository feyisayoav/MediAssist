apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediassist
  namespace: mediassist
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"      # X-ray / skin images (default 1m rejects them)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"   # gateway allows the chatbot up to 120s
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  rules:
    - host: mediassist.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: gateway, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {number: 80}}
