apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mediassist
  labels: {app: gateway, part-of: mediassist}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway, part-of: mediassist}
    spec:
      containers:
        - name: gateway
          image: mediassist-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - {name: PORT, value: "8080"}
          envFrom:
            - configMapRef: {name: mediassist-config}
          resources:
            requests: {memory: 32Mi, cpu: 50m}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 8080}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: mediassist
spec:
  selector: {app: gateway}
  ports:
    - port: 8080
      targetPort: 8080
