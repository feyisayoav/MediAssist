apiVersion: apps/v1
kind: Deployment
metadata:
  name: imaging
  namespace: mediassist
  labels: {app: imaging, part-of: mediassist}
spec:
  replicas: 1
  selector:
    matchLabels: {app: imaging}
  template:
    metadata:
      labels: {app: imaging, part-of: mediassist}
    spec:
      containers:
        - name: imaging
          image: mediassist-imaging:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests: {memory: 1Gi, cpu: 500m}
            limits: {memory: 3Gi}
          startupProbe:
            tcpSocket: {port: 8001}
            periodSeconds: 5
            failureThreshold: 60      # up to 5 min to load models
          readinessProbe:
            tcpSocket: {port: 8001}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8001}
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: imaging
  namespace: mediassist
spec:
  selector: {app: imaging}
  ports:
    - port: 8001
      targetPort: 8001
